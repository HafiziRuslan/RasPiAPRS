[project]
name = 'RasPiAPRS'
version = '0.1b16'
description = 'APRS for Pi-Star/WPSD/ASL/DVS/SVX on Raspberry Pi'
keywords = ['amateur-radio', 'aprs', 'aprs-beacon', 'aprs-telemetry', 'aprs-messaging', 'mmdvm', 'pi-star', 'wpsd', 'allstarlink', 'dvswitch', 'svxlink']
readme = 'README.md'
license = 'GPL-3.0-or-later'
license-files = ['LICENSE']
authors = [
  { name = 'Fred Cirera', email = 'github-fred@hidzz.com' },
  { name = 'Hafizi Ruslan', email = '30207509+HafiziRuslan@users.noreply.github.com' },
]
maintainers = [{ name = 'Hafizi Ruslan', email = '30207509+HafiziRuslan@users.noreply.github.com' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Intended Audience :: Other Audience',
  'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
  'Natural Language :: English',
  'Natural Language :: Malay',
  'Operating System :: POSIX :: Linux',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3.15',
  'Programming Language :: Python :: 3.16',
  'Topic :: Communications :: Ham Radio',
]
urls.github = 'https://git.new/RasPiAPRS'
urls.repository = 'https://github.com/HafiziRuslan/RasPiAPRS.git'
urls.sourcecode = 'https://github.com/0x9900/aprstar.git'
urls.history = 'https://github.com/HafiziRuslan/RasPiAPRS/blob/master/CHANGELOG.md'
urls.issuetracker = 'https://github.com/HafiziRuslan/RasPiAPRS/issues'
requires-python = '>= 3.13'
dependencies = [
  'aiohttp',
  'aprslib',
  'callsign-regex',
  'geopy',
  'gpsdclient',
  'humanize',
  'psutil',
  'python-dateutil',
  'python-dotenv',
  'python-telegram-bot',
]

[tool.uv.sources]
aprslib = { git = 'https://github.com/rossengeorgiev/aprs-python' }

[tool.ruff]
analyze.detect-string-imports = true
fix = true
format.docstring-code-format = true
format.indent-style = 'tab'
format.line-ending = 'lf'
format.quote-style = 'single'
format.skip-magic-trailing-comma = true
indent-width = 2
line-length = 150
lint.isort.combine-as-imports = true
lint.isort.default-section = 'first-party'
lint.isort.force-single-line = true
lint.isort.force-sort-within-sections = true
lint.isort.force-wrap-aliases = true
